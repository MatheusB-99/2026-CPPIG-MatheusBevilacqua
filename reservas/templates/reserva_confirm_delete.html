{% extends 'principal.html' %}
{% block content %}
<section class="section py-4">
    <div class="container">
        <div class="form-slide-shell">
            <h3 class="form-slide-title">Excluir Reserva</h3>
            <div class="card card-body slide-form">
                <p class="mb-2"><strong>ID da Reserva:</strong> {{ object.id }}</p>
                <p class="mb-2"><strong>Usuario:</strong> {{ object.usuario.nome }}</p>
                <p class="mb-3"><strong>Data:</strong> {{ object.data|date:"d/m/Y" }} as {{ object.horario }}</p>
                <p class="mb-3">Tem certeza que deseja excluir esta reserva?</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-actions">
                        <button type="submit" class="btn btn-danger">Confirmar Exclusao</button>
                        <a class="btn btn-secondary" href="{% url 'reservas' %}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
