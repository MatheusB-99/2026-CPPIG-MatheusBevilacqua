{% extends 'principal.html' %}
{% block content %}
<section class="section py-4">
    <div class="container">
        <div class="form-slide-shell">
            <h3 class="form-slide-title">Cadastro de Copia de Chave</h3>

            <form method="post" class="card card-body slide-form">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn btn-secondary" href="{% url 'copias_chave' %}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
